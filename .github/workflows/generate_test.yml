name: generate_test

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  check_generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Run go generate
        run: go generate ./...

      - name: Check diff
        run: git diff --quiet . || (git --no-pager diff . && exit 1 || exit 1)
